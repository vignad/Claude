<!DOCTYPE html>
<html>
<head>
<title>Schema.org Data Types</title>
</head>
<body>

<h1>Schema.org Data Types</h1>

<label for="datatype">Choose a data type:</label>
<select id="datatype" name="datatype">
  <option value="Boolean" title="Boolean: True or False.">Boolean</option>
  <option value="Date" title="A date value in ISO 8601 date format.">Date</option>
  <option value="DateTime" title="A combination of date and time of day in the form [-]CCYY-MM-DDThh:mm:ss[Z|(+|-)hh:mm] (see Chapter 5.4 of ISO 8601).">DateTime</option>
  <option value="Number" title="Use values from 0123456789 (Unicode 'DIGIT ZERO' (U+0030) to 'DIGIT NINE' (U+0039)) rather than superficially similar Unicode symbols.">Number</option>
  <option value="Number_Float" title="Floating number.">Number_Float</option>
  <option value="Number_Integer" title="Integer.">Number_Integer</option>
  <option value="Quantity" title="Quantities such as distance, time, mass, weight, etc. Particular instances of say Mass are strings like '3 kg' or '4 milligrams'.">Quantity</option>
  <option value="Quantity_Distance" title="Properties that take Distances as values are of the form '<Number> <Length unit of measure>'. E.g., '7 ft'.">Quantity_Distance</option>
  <option value="Quantity_Duration" title="Quantity: Duration (use ISO 8601 duration format).">Quantity_Duration</option>
  <option value="Quantity_Energy" title="Properties that take Energy as values are of the form '<Number> <Energy unit of measure>'.">Quantity_Energy</option>
  <option value="Quantity_Mass" title="Properties that take Mass as values are of the form '<Number> <Mass unit of measure>'. E.g., '7 kg'.">Quantity_Mass</option>
  <option value="Text">Text</option>
  <option value="Text_CssSelectorType" title="Text representing a CSS selector.">Text_CssSelectorType</option>
  <option value="Text_PronounceableText" title="PronounceableText.">Text_PronounceableText</option>
  <option value="Text_URL" title="URL.">Text_URL</option>
  <option value="Text_XPathType" title="Text representing an XPath (typically but not necessarily version 1.0).">Text_XPathType</option>
  <option value="Time" title="A point in time recurring on multiple days in the form hh:mm:ss[Z|(+|-)hh:mm]">Time</option>
</select>

</body>
</html>
